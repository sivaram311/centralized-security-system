# Test / CI profile — in-memory H2 (does not require Postgres)
# Activate: @ActiveProfiles("test") or -Dspring.profiles.active=test

server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:css_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

css:
  issuer: http://localhost:9000
  cors:
    allowed-origin-patterns: "*"
  seed:
    enabled: true
    admin-password: admin123
    demo-password: demo123
  keys:
    private-key-path: classpath:keys/private.pem
    public-key-path: classpath:keys/public.pem

logging:
  level:
    com.css.auth: WARN
