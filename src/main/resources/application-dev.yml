# DEV profile — Centralized Security System (E: / :9000)
# Activate: --spring.profiles.active=dev
# Aligned with PREPROD/PROD: Postgres schema-per-env (app_css.dev)

server:
  port: ${CSS_PORT:9000}

spring:
  datasource:
    url: ${CSS_JDBC_URL:jdbc:postgresql://127.0.0.1:5432/app_css?currentSchema=dev}
    driver-class-name: org.postgresql.Driver
    username: ${CSS_DB_USER:app_css_dev}
    password: ${CSS_DB_PASSWORD:}
    # Shared PG :5432 — INCIDENT 2026-07-16 (PROPOSAL pool-caps, Grok PROCEED)
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: dev
  h2:
    console:
      enabled: false

css:
  issuer: ${CSS_ISSUER:http://127.0.0.1:9000}
  cors:
    allowed-origin-patterns: ${CSS_CORS_ORIGINS:http://127.0.0.1:*,http://localhost:*,https://delena.buzz,https://*.delena.buzz}
  seed:
    enabled: ${CSS_SEED_ENABLED:true}
    admin-password: ${CSS_ADMIN_PASSWORD:admin123}
    demo-password: ${CSS_DEMO_PASSWORD:demo123}
  keys:
    private-key-path: ${CSS_PRIVATE_KEY:classpath:keys/private.pem}
    public-key-path: ${CSS_PUBLIC_KEY:classpath:keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.css.auth: INFO
