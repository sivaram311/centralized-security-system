server:
  port: 9000

spring:
  application:
    name: centralized-security-system
  # Datasource is profile-specific:
  #   dev / preprod / prod → Postgres (app_css.{schema})
  #   test / h2            → in-memory H2
  # Prefer: --spring.profiles.active=dev  (see scripts/start-dev.ps1)

css:
  issuer: http://localhost:9000
  cors:
    # Any origin for Agent API / browser clients; auth still required on protected routes
    allowed-origin-patterns: ${CSS_CORS_ORIGINS:*}
  jwt:
    access-expiration-ms: 900000       # 15 minutes
    refresh-expiration-days: 7
  oauth:
    # Authorization-code TTL for SSO redirect flow (Phase 2)
    code-expiration-seconds: 120
    sso-session-expiration-hours: 8
    cookie-name: CSS_SSO
    cookie-secure: ${CSS_SSO_COOKIE_SECURE:false}
    cookie-same-site: Lax
  # RS256 key pair — generate production keys via scripts/generate-keys.sh
  keys:
    private-key-path: classpath:keys/private.pem
    public-key-path: classpath:keys/public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.css.auth: INFO
