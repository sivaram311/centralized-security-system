# Optional local H2 profile (demos without Postgres)
# Activate: --spring.profiles.active=h2

spring:
  datasource:
    url: jdbc:h2:mem:css;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

css:
  issuer: http://localhost:9000
  seed:
    enabled: true
    admin-password: admin123
    demo-password: demo123
